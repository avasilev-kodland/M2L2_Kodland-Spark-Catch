<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Kodland Spark Catch</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0e1017;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;}
  #wrap{position:relative;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,12,20,.42);backdrop-filter:blur(2px);cursor:pointer;}
  .hidden{opacity:0;pointer-events:none;}
  .brand{font-size:clamp(15px,3.8vw,25px);font-weight:800;letter-spacing:7px;color:#c9f24d;text-shadow:0 4px 16px rgba(201,242,77,.5);}
  .title{font-size:clamp(28px,8.5vw,60px);font-weight:900;letter-spacing:2px;color:#fff;margin-top:-4px;text-shadow:0 6px 26px rgba(120,160,255,.5);}
  .btn{width:clamp(68px,16vw,90px);height:clamp(68px,16vw,90px);border-radius:50%;background:linear-gradient(145deg,#c9f24d,#a6da31);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(201,242,77,.4);animation:pulse 1.4s ease-in-out infinite;margin-top:6px;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  .tri{width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:23px solid #17301f;margin-left:6px;}
  .redo{font-size:clamp(34px,8vw,46px);color:#17301f;}
  .big{font-size:clamp(60px,19vw,116px);font-weight:900;color:#fff;text-shadow:0 6px 26px rgba(120,160,255,.5);}
  .best{display:flex;align-items:center;gap:10px;font-size:clamp(19px,5vw,28px);font-weight:800;color:#c9f24d;}
  .lives{position:absolute;top:10px;right:14px;font-size:22px;letter-spacing:3px;z-index:3;}
  .legend{display:flex;gap:14px;font-size:13px;color:#aeb3c6;margin-top:2px;align-items:center;}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="lives" class="lives"></div>
  <div id="intro" class="overlay">
    <div class="brand">KODLAND</div><div class="title">SPARK CATCH</div>
    <div class="legend"><span><span class="dot" style="background:#c9f24d"></span>+</span><span><span class="dot" style="background:#ffd23f"></span>★</span><span><span class="dot" style="background:#ff4d4d"></span>✕</span></div>
    <div class="btn"><div class="tri"></div></div>
  </div>
  <div id="over" class="overlay hidden"><div class="big" id="fs">0</div><div class="best"><span>🏆</span><span id="bs">0</span></div><div class="btn"><div class="redo">↻</div></div></div>
</div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1;
  var intro=document.getElementById('intro'),over=document.getElementById('over'),fs=document.getElementById('fs'),bs=document.getElementById('bs'),livesEl=document.getElementById('lives');
  function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  var state='intro',score=0,best=0,lives=3,orbs=[],parts=[],trail=[],padX=0,padW=0,baseW=0,spawnT=0,fallBase=0,combo=0,shake=0,flash=0,slowT=0,wideT=0,t=0,last=performance.now();
  var ac=null;
  function tone(f,d,ty,v){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.value=v||.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d+.02);}catch(e){}}
  function mult(){return Math.min(1+Math.floor(combo/4),8);}
  function start(){score=0;lives=3;orbs=[];parts=[];trail=[];combo=0;spawnT=0;slowT=0;wideT=0;t=0;fallBase=H*0.0055+1.1;baseW=Math.max(58,W*0.15);padW=baseW;padX=W/2;state='play';intro.classList.add('hidden');over.classList.add('hidden');drawLives();}
  function drawLives(){livesEl.textContent=state==='play'?'❤'.repeat(lives):'';}
  function burst(x,y,hue,n){for(var i=0;i<n;i++){var a=Math.random()*6.28,s=1.5+Math.random()*3.6;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,hue:hue,r:2+Math.random()*2});}}
  function over_(){state='over';if(score>best)best=score;fs.textContent=score;bs.textContent=best;drawLives();tone(230,.22,'sawtooth',.05);setTimeout(function(){over.classList.remove('hidden');},350);}
  function spawn(){
    var r=Math.random(),type='good';
    if(r<0.055)type='gold';else if(r<0.055+Math.min(0.28,0.10+t/4000))type='bomb';
    else if(r<0.94&&Math.random()<0.012)type=(Math.random()<0.5?'wide':'slow');
    orbs.push({x:24+Math.random()*(W-48),y:-16,type:type,r:type==='gold'?13:12,spin:Math.random()*6});
  }
  function frame(now){var dt=Math.min(2,(now-last)/16.67);last=now;
    if(state==='play'){
      t+=dt;
      if(slowT>0)slowT-=dt; if(wideT>0)wideT-=dt; else if(padW>baseW)padW+=(baseW-padW)*0.1*dt;
      var fall=(fallBase+t*0.0011)*(slowT>0?0.5:1);
      spawnT-=dt;if(spawnT<=0){spawnT=Math.max(16,46-t*0.02);spawn();}
      trail.push({x:padX,y:H-H*0.07,a:0.5});if(trail.length>10)trail.shift();
      for(var i=trail.length-1;i>=0;i--)trail[i].a-=0.05*dt;
      for(var k=orbs.length-1;k>=0;k--){var o=orbs[k];o.y+=fall*dt*(o.type==='bomb'?1.12:1);o.spin+=0.1*dt;
        if(o.y>H-H*0.10 && o.y<H-H*0.015 && Math.abs(o.x-padX)<padW/2+o.r){
          orbs.splice(k,1);
          if(o.type==='bomb'){lives--;combo=0;shake=10;burst(o.x,o.y,0,16);tone(180,.14,'square',.06);drawLives();if(lives<=0){over_();}}
          else if(o.type==='wide'){wideT=360;padW=baseW*1.8;flash=0.5;burst(o.x,o.y,210,14);tone(660,.12,'triangle',.05);}
          else if(o.type==='slow'){slowT=300;flash=0.5;burst(o.x,o.y,180,14);tone(520,.12,'sine',.05);}
          else{combo++;var val=(o.type==='gold'?5:1)*mult();score+=val;shake=o.type==='gold'?7:2;flash=o.type==='gold'?0.7:0;burst(o.x,o.y,o.type==='gold'?48:90,o.type==='gold'?20:9);tone((o.type==='gold'?700:460)+Math.min(combo,20)*14,.08,'triangle',.05);}
          continue;
        }
        if(o.y>H+18){if(o.type==='good'||o.type==='gold'){lives--;combo=0;shake=6;drawLives();if(lives<=0){over_();}}orbs.splice(k,1);}
      }
    }
    if(shake>0){shake*=0.85;if(shake<0.2)shake=0;} if(flash>0){flash-=0.05*dt;if(flash<0)flash=0;}
    for(var p=parts.length-1;p>=0;p--){var pt=parts[p];pt.vy+=0.15*dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=0.028*dt;if(pt.life<=0)parts.splice(p,1);}
    var cm=Math.min(combo,20)/20;
    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'hsl('+(220-cm*30)+',40%,'+(11+cm*4)+'%)');g.addColorStop(1,'#0b0d15');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    for(var oi=0;oi<orbs.length;oi++){var ob=orbs[oi];drawOrb(ob);}
    for(var ti=0;ti<trail.length;ti++){var tr=trail[ti];ctx.globalAlpha=Math.max(0,tr.a);ctx.fillStyle='#5c7cfa';roundRect(tr.x-padW/2,tr.y,padW,10,5);ctx.fill();}ctx.globalAlpha=1;
    var py=H-H*0.07;ctx.save();ctx.shadowColor=wideT>0?'rgba(90,240,180,.9)':'rgba(92,124,250,.9)';ctx.shadowBlur=20;ctx.fillStyle=wideT>0?'#5af0b4':'#5c7cfa';roundRect(padX-padW/2,py,padW,13,7);ctx.fill();ctx.restore();
    for(var qi=0;qi<parts.length;qi++){var q=parts[qi];ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle='hsl('+q.hue+',88%,64%)';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();}ctx.globalAlpha=1;
    ctx.restore();
    if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.22)+')';ctx.fillRect(0,0,W,H);}
    if(state==='play'){
      ctx.fillStyle='#fff';ctx.font='900 '+Math.round(H*0.1)+'px Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.shadowColor='rgba(120,160,255,.5)';ctx.shadowBlur=14;ctx.fillText(score,W/2,8);ctx.shadowBlur=0;
      if(combo>=4){ctx.fillStyle='#ffd23f';ctx.font='800 '+Math.round(H*0.05)+'px Arial';ctx.fillText('x'+mult(),W/2,8+H*0.11);}
      if(slowT>0){ctx.fillStyle='#87f2ff';ctx.font='700 '+Math.round(H*0.04)+'px Arial';ctx.textAlign='left';ctx.fillText('❄',10,10);}
    }
    requestAnimationFrame(frame);
  }
  function drawOrb(o){ctx.save();var col=o.type==='bomb'?'#ff4d4d':(o.type==='gold'?'#ffd23f':(o.type==='wide'?'#5af0b4':(o.type==='slow'?'#87f2ff':'#c9f24d')));ctx.shadowColor=col;ctx.shadowBlur=o.type==='gold'?24:16;ctx.fillStyle=col;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.shadowBlur=0;
    if(o.type==='bomb'){ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(o.x-5,o.y-5);ctx.lineTo(o.x+5,o.y+5);ctx.moveTo(o.x+5,o.y-5);ctx.lineTo(o.x-5,o.y+5);ctx.stroke();}
    else if(o.type==='gold'){star(o.x,o.y,o.spin);}
    else if(o.type==='wide'){ctx.strokeStyle='#08321f';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(o.x-6,o.y);ctx.lineTo(o.x+6,o.y);ctx.stroke();}
    else if(o.type==='slow'){ctx.fillStyle='#08323a';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('❄',o.x,o.y+1);}
    ctx.restore();}
  function star(x,y,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle='#7a5800';ctx.beginPath();for(var i=0;i<10;i++){var a=Math.PI*i/5,rr=i%2?3:7;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.restore();}
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function move(clientX){var rect=cv.getBoundingClientRect();padX=Math.max(padW/2,Math.min(W-padW/2,clientX-rect.left));}
  cv.addEventListener('mousemove',function(e){if(state==='play')move(e.clientX);});
  cv.addEventListener('touchmove',function(e){e.preventDefault();if(state==='play'&&e.touches[0])move(e.touches[0].clientX);},{passive:false});
  function act(){if(state!=='play')start();}
  intro.addEventListener('mousedown',act);intro.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
  over.addEventListener('mousedown',act);over.addEventListener('touchstart',function(e){e.preventDefault();act();},{passive:false});
  window.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();act();}if(state==='play'){if(e.code==='ArrowLeft')padX=Math.max(padW/2,padX-W*0.06);if(e.code==='ArrowRight')padX=Math.min(W-padW/2,padX+W*0.06);}});
  window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
